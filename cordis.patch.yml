# dsh-prompt-upgrade bundle patch: inserts the prompt-upgrade plugin row
# into the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); install with
# `dsh plugin --profile web add link:<repo>/dsh-prompt-upgrade`.
#
# One package, both halves: the node half (exports ".") runs in the host
# process and registers the POST /prompt-upgrade/enhance route and the
# /enhance slash command, and declares the "prompt-upgrade" settings section
# this entry's configuration writes (read live, per request); the browser
# half (declared by `dsh.client`, served from lib/client.js) adds the
# composer enhance button (conversation.input.right), the preview panel, the
# undo bar (conversation.input.dock), and the settings panel registered into
# the 「ANB 工具」 shell tab (anb.tool.tab) — N29, one settings entry only.
- insert:
    - id: prompt-upgrade
      name: dsh-prompt-upgrade
